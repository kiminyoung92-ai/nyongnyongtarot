.box{background:#1d1727;border:1px solid #3a3048;border-radius:20px;padding:15px;margin-top:14px}

<h1>🔮 뇽뇽타로</h1><div class="sub">뻔한 위로 없이, 카드 그대로 · 매 질문 새 셔플</div>
<section class="box">
<div class="modes">
<button type="button" class="mode on" data-m="속마음">속마음</button><button type="button" class="mode" data-m="연애운">연애운</button>
<button type="button" class="mode" data-m="오늘운세">오늘운세</button><button type="button" class="mode" data-m="양자택일">양자택일</button>

</div>

<button type="button" class="go" id="go">10장 새로 셔플해서 팩폭 리딩</button>
<div id="status">질문을 적고 눌러. 같은 질문도 매번 완전히 새 셔플.</div>
</section>
<div class="cards" id="cards"></div>
<section class="box" id="result">
<h2 id="verdict"></h2><p id="summary"></p><div id="scores"></div>
<h3>상세 리딩</h3><div id="detail"></div>
<h3>뽑힌 카드</h3><p id="list"></p>
<h3>핵심 조합</h3><p id="combo"></p>
<h3>3덱 교차검증</h3><p id="validation"></p><h3>판정 신뢰도</h3><p id="confidence"></p><h3>팩폭</h3><p id="caution"></p>
<h3>현실에서 확인할 것</h3><p id="watch"></p>
<h3>최종 판정</h3><p><b id="final"></b></p>
<div class="row" style="margin-top:14px"><button type="button" class="secondary" id="makeImage">결과 이미지 만들기</button></div>
<div id="imageArea" style="display:none;margin-top:14px;text-align:center"><canvas id="shareCanvas" width="1080" height="1920" style="width:100%;max-width:360px;border-radius:18px;border:1px solid #463952"></canvas><div class="row"><button type="button" class="secondary" id="saveImage">PNG 저장</button><button type="button" class="secondary" id="shareImage">공유하기</button></div></div>

</section>

function wrapText(ctx,text,x,y,maxWidth,lineHeight,maxLines){
  var words=String(text||"").split(/\s+/), line="", lines=[];
  for(var i=0;i<words.length;i++){
    var test=line+(line?" ":"")+words[i];
    if(ctx.measureText(test).width>maxWidth && line){lines.push(line);line=words[i];}
    else line=test;
  }
  if(line) lines.push(line);
  lines=lines.slice(0,maxLines||99);
  for(var j=0;j<lines.length;j++) ctx.fillText(lines[j],x,y+j*lineHeight);
  return y+lines.length*lineHeight;
}
